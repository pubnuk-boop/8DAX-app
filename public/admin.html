<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - 8DAX</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #222; color: #fff; padding: 20px; display: flex; justify-content: center; }
    .card { background: #333; padding: 20px; border-radius: 12px; max-width: 400px; width: 100%; }
    .field { margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; margin-bottom: 5px; }
    input[type="file"] { width: 100%; background: #444; padding: 8px; border-radius: 6px; color: #fff; }
    button { width: 100%; background: #d9383a; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Gestion des Médias</h2>
    <form id="uploadForm">
      <div class="field">
        <label>Changer la photo de profil</label>
        <input type="file" id="avatarInput" name="profilePic">
      </div>
      <div class="field">
        <label>Changer le message vocal</label>
        <input type="file" id="vocalInput" name="voiceNote">
      </div>
      <button type="button" onclick="uploadFiles()">Publier les modifications</button>
    </form>
  </div>

  <script>
    async function uploadFiles() {
      const avatarFile = document.getElementById('avatarInput').files[0];
      const vocalFile = document.getElementById('vocalInput').files[0];

      if (!avatarFile && !vocalFile) {
        alert('Veuillez sélectionner au moins un fichier.');
        return;
      }

      const formData = new FormData();
      if (avatarFile) formData.append('profilePic', avatarFile);
      if (vocalFile) formData.append('voiceNote', vocalFile);

      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (data.success) {
          if (data.profilePic) localStorage.setItem('8dax_profilePic', data.profilePic);
          if (data.voiceNote) localStorage.setItem('8dax_voiceNote', data.voiceNote);
          alert('Mise à jour réussie !');
        } else {
          alert('Erreur: ' + (data.message || 'Échec de l\'envoi'));
        }
      } catch (err) {
        alert('Erreur réseau lors de l\'envoi');
      }
    }
  </script>
</body>
</html>
