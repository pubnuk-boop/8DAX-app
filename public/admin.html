<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f4; padding: 40px; display: flex; justify-content: center; }
    .card { background: white; padding: 24px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; }
    input[type="password"], input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #d9383a; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="card">
  <!-- Login Form -->
  <div id="loginSection">
    <h2>Admin Login</h2>
    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="passwordInput">
    </div>
    <button onclick="login()">Se Connecter</button>
  </div>

  <!-- Upload Form -->
  <div id="uploadSection" class="hidden">
    <h2>Gestion des Médias</h2>
    <div class="field">
      <label>Changer la photo de profil</label>
      <input type="file" id="avatarInput" accept="image/*">
    </div>
    <div class="field">
      <label>Changer le message vocal</label>
      <input type="file" id="vocalInput" accept="audio/*,.mp3,.m4a,.qta,.caf">


    </div>
    <button onclick="uploadFiles()">Publier les modifications</button>
  </div>
</div>

<script>
  let token = localStorage.getItem('adminToken');
  if (token) showUploads();

  async function login() {
    const password = document.getElementById('passwordInput').value;
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    const data = await res.json();
    if (data.success) {
      token = data.token;
      localStorage.setItem('adminToken', token);
      showUploads();
    } else {
      alert(data.message);
    }
  }

  function showUploads() {
    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('uploadSection').classList.remove('hidden');
  }

  async function uploadFiles() {
    const formData = new FormData();
    const avatar = document.getElementById('avatarInput').files[0];
    const vocal = document.getElementById('vocalInput').files[0];

    if (avatar) formData.append('avatar', avatar);
    if (vocal) formData.append('vocal', vocal);

    const res = await fetch('/api/admin/upload', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}` },
      body: formData
    });

    if (res.ok) {
      alert('Contenu mis à jour avec succès !');
    } else {
      alert('Erreur lors de l’envoi');
    }
  }
</script>
</body>
</html>
