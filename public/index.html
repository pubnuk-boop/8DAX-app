<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mopizor — Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff7f5;
      color: #76272c;
      min-height: 100vh;
    }

    /* ================= HEADER ================= */

    header {
      height: 138px;
      background: #fff;
      border-top: 5px solid #d9272e;
      border-bottom: 2px solid #f2d4d4;

      display: flex;
      align-items: center;
      padding: 0 46px;

      box-shadow: 0 2px 7px rgba(130, 40, 40, .08);
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .avatar-wrapper {
      position: relative;
      width: 92px;
      height: 92px;
    }

    .avatar {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #d9272e;
      display: block;
    }

    .online-dot {
      position: absolute;
      width: 29px;
      height: 29px;
      right: -1px;
      bottom: 0;

      background: #25c878;
      border-radius: 50%;
      border: 3px solid white;
    }

    .profile-info h1 {
      font-size: 28px;
      font-weight: 600;
      color: #78292d;
      margin-bottom: 8px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      color: #8a3438;
    }

    .status-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #4bcf91;
    }

    .hamburger {
      margin-left: auto;
      width: 42px;
      height: 42px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 7px;

      cursor: pointer;
    }

    .hamburger span {
      display: block;
      width: 35px;
      height: 4px;
      border-radius: 4px;
      background: #6c7585;
    }

    /* ================= MAIN ================= */

    main {
      padding: 34px 29px 160px;
      max-width: 900px;
      margin: auto;
    }

    /* ================= INTRO ================= */

    .intro {
      background: #fff;

      border: 2px solid #f1cfd0;
      border-radius: 27px;

      padding: 28px 31px;

      box-shadow: 0 3px 8px rgba(100, 30, 30, .10);

      font-size: 27px;
      line-height: 1.55;

      margin-bottom: 27px;
    }

    .intro p + p {
      margin-top: 20px;
    }

    /* ================= AUDIO ================= */

    .audio-card {
      background: #fff;

      border: 2px solid #f1cfd0;
      border-radius: 27px;

      padding: 25px 27px;

      box-shadow: 0 3px 8px rgba(100, 30, 30, .09);

      margin-bottom: 25px;
    }

    .audio-title {
      display: flex;
      align-items: center;
      gap: 13px;

      color: #687488;
      font-size: 25px;
      margin-bottom: 17px;
    }

    .mic {
      width: 40px;
      height: 40px;
      border-radius: 50%;

      background: #d72c32;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 21px;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .play-button {
      flex: 0 0 auto;

      width: 80px;
      height: 80px;

      border: none;
      border-radius: 50%;

      background: #df272e;
      color: white;

      font-size: 35px;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      padding-left: 6px;

      box-shadow: 0 2px 5px rgba(120, 20, 20, .15);
    }

    .audio-progress-area {
      flex: 1;
    }

    .progress {
      width: 100%;
      height: 8px;
      background: #f2c8ca;
      border-radius: 10px;
      position: relative;
      cursor: pointer;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #df272e;
      border-radius: 10px;
    }

    .progress-knob {
      position: absolute;
      left: 0;
      top: 50%;

      width: 29px;
      height: 29px;

      transform: translate(-2px, -50%);

      border-radius: 50%;
      background: #df272e;

      border: 5px solid #f6d6d7;
    }

    .time-row {
      display: flex;
      justify-content: space-between;

      margin-top: 9px;

      font-size: 21px;
      color: #8b96a6;
    }

    .speed {
      width: 72px;
      height: 49px;

      border-radius: 12px;

      background: #f9dddd;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #df272e;
      font-size: 19px;
      font-weight: bold;
    }

    /* ================= FAQ BUTTONS ================= */

    .questions {
      display: flex;
      gap: 18px;

      margin-bottom: 365px;
    }

    .question {
      flex: 1;

      min-height: 67px;

      padding: 12px 23px;

      border: 2px solid #f0c8ca;
      border-radius: 35px;

      background: #fff;

      color: #bd3035;

      font-size: 22px;
      font-weight: 600;

      cursor: pointer;

      transition: .2s;
    }

    .question:hover {
      background: #fff0ef;
    }

    /* ================= INFORMATION BOX ================= */

    .info-box {
      background: #fff9f8;

      border: 2px solid #f1cfd0;
      border-radius: 27px;

      padding: 27px;

      box-shadow: 0 3px 8px rgba(100, 30, 30, .08);

      margin-bottom: 30px;
    }

    .info-title {
      color: #aab4c6;

      font-size: 19px;
      font-weight: bold;

      letter-spacing: 3px;

      margin-bottom: 22px;
    }

    .info-list {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    .info-item {
      background: #fff;

      border: 2px solid #f1cfd0;

      border-radius: 30px;

      padding: 13px 22px;

      color: #8c3a3f;

      font-size: 19px;
      font-weight: bold;
    }

    /* ================= CHAT ================= */

    .chat {
      display: flex;
      align-items: center;
      gap: 16px;

      position: fixed;

      left: 29px;
      right: 29px;
      bottom: 22px;

      max-width: 842px;
      margin: auto;
    }

    .message-input {
      flex: 1;

      height: 74px;

      border: 2px solid #f0c8ca;
      border-radius: 40px;

      background: #fffafa;

      padding: 0 32px;

      font-size: 22px;
      outline: none;

      color: #763136;
    }

    .message-input::placeholder {
      color: #ca9a9d;
    }

    .send {
      width: 78px;
      height: 78px;

      border: none;
      border-radius: 50%;

      background: #f5aeb2;

      color: white;

      font-size: 32px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ================= MENU ================= */

    .menu {
      display: none;

      position: absolute;
      right: 25px;
      top: 115px;

      width: 230px;

      background: white;

      border: 1px solid #f0cccc;
      border-radius: 15px;

      box-shadow: 0 8px 30px rgba(0,0,0,.12);

      padding: 10px;

      z-index: 10;
    }

    .menu.active {
      display: block;
    }

    .menu div {
      padding: 14px;

      border-radius: 10px;

      cursor: pointer;
      color: #763136;
      font-size: 17px;
    }

    .menu div:hover {
      background: #fff0ef;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 650px) {

      header {
        height: 138px;
        padding: 0 28px;
      }

      .avatar-wrapper,
      .avatar {
        width: 92px;
        height: 92px;
      }

      .profile-info h1 {
        font-size: 26px;
      }

      .status {
        font-size: 21px;
      }

      main {
        padding: 33px 24px 145px;
      }

      .intro {
        font-size: 26px;
        padding: 24px 30px;
      }

      .audio-card {
        padding: 23px;
      }

      .audio-controls {
        gap: 15px;
      }

      .play-button {
        width: 78px;
        height: 78px;
      }

      .speed {
        display: none;
      }

      .questions {
        gap: 15px;
        margin-bottom: 365px;
      }

      .question {
        font-size: 20px;
        padding: 10px 18px;
      }

      .info-box {
        padding: 25px;
      }

      .info-list {
        gap: 12px;
      }

      .info-item {
        font-size: 17px;
        padding: 11px 17px;
      }

      .chat {
        left: 24px;
        right: 24px;
      }

      .message-input {
        height: 68px;
        font-size: 19px;
        padding: 0 25px;
      }

      .send {
        width: 70px;
        height: 70px;
      }
    }

    @media (max-width: 450px) {

      .profile {
        gap: 13px;
      }

      .avatar-wrapper,
      .avatar {
        width: 80px;
        height: 80px;
      }

      .online-dot {
        width: 27px;
        height: 27px;
      }

      .profile-info h1 {
        font-size: 22px;
      }

      .status {
        font-size: 18px;
      }

      .hamburger span {
        width: 32px;
      }

      .intro {
        font-size: 22px;
        line-height: 1.55;
      }

      .questions {
        flex-direction: column;
        margin-bottom: 330px;
      }

      .question {
        width: 100%;
      }

      .audio-title {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header>

    <div class="profile">

      <div class="avatar-wrapper">
        <img
          class="avatar"
          src="avatar.jpg"
          alt="Profil"
        >

        <div class="online-dot"></div>
      </div>

      <div class="profile-info">
        <h1>Mopizor Assistant</h1>

        <div class="status">
          <span class="status-dot"></span>
          En ligne
        </div>
      </div>

    </div>

    <div class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>

  </header>

  <!-- ================= MENU ================= -->

  <div class="menu" id="menu">
    <div>Accueil</div>
    <div>Informations</div>
    <div>Questions fréquentes</div>
    <div>Contact</div>
  </div>


  <!-- ================= MAIN ================= -->

  <main>

    <!-- INTRO -->

    <section class="intro">

      <p>
        Salut ! Tu es au bon endroit. 👌
      </p>

      <p>
        Avant de poser tes questions écoute d'abord
        le vocal suivant
      </p>

    </section>


    <!-- AUDIO -->

    <section class="audio-card">

      <div class="audio-title">

        <div class="mic">
          🎙
        </div>

        <span>Message vocal</span>

      </div>

      <div class="audio-controls">

        <button class="play-button" id="play">
          ▶
        </button>

        <div class="audio-progress-area">

          <div class="progress" id="progress">

            <div
              class="progress-fill"
              id="progressFill">
            </div>

            <div
              class="progress-knob"
              id="progressKnob">
            </div>

          </div>

          <div class="time-row">

            <span id="currentTime">
              0:00
            </span>

            <span id="duration">
              0:00
            </span>

          </div>

        </div>

        <div class="speed">
          1x
        </div>

      </div>

    </section>


    <!-- QUESTIONS -->

    <section class="questions">

      <button
        class="question"
        onclick="showAnswer('Comment fonctionne ce service ?')">

        Comment fonctionne ce service ?

      </button>

      <button
        class="question"
        onclick="showAnswer('Comment m’inscrire ?')">

        Comment m'inscrire ?

      </button>

    </section>


    <!-- INFORMATION -->

    <section class="info-box">

      <div class="info-title">
        INFORMATIONS
      </div>

      <div class="info-list">

        <div class="info-item">
          Documentation
        </div>

        <div class="info-item">
          Guide utilisateur
        </div>

        <div class="info-item">
          FAQ
        </div>

        <div class="info-item">
          Assistance
        </div>

        <div class="info-item">
          Nouveautés
        </div>

        <div class="info-item">
          Contact
        </div>

      </div>

    </section>

  </main>


  <!-- ================= CHAT ================= -->

  <div class="chat">

    <input
      id="message"
      class="message-input"
      type="text"
      placeholder="Écrivez votre message..."
    >

    <button
      class="send"
      id="send">

      ➤

    </button>

  </div>


  <!-- ================= AUDIO FILE ================= -->

  <audio id="audio" src="message.mp3"></audio>


  <script>

    /* ================= MENU ================= */

    const hamburger =
      document.getElementById("hamburger");

    const menu =
      document.getElementById("menu");

    hamburger.addEventListener("click", () => {
      menu.classList.toggle("active");
    });


    /* ================= AUDIO ================= */

    const audio =
      document.getElementById("audio");

    const play =
      document.getElementById("play");

    const progress =
      document.getElementById("progress");

    const progressFill =
      document.getElementById("progressFill");

    const progressKnob =
      document.getElementById("progressKnob");

    const currentTime =
      document.getElementById("currentTime");

    const duration =
      document.getElementById("duration");


    function formatTime(seconds) {

      if (!isFinite(seconds)) return "0:00";

      const minutes =
        Math.floor(seconds / 60);

      const secs =
        Math.floor(seconds % 60)
          .toString()
          .padStart(2, "0");

      return `${minutes}:${secs}`;
    }


    audio.addEventListener("loadedmetadata", () => {

      duration.textContent =
        formatTime(audio.duration);

    });


    play.addEventListener("click", () => {

      if (audio.paused) {

        audio.play();

        play.textContent = "❚❚";

      } else {

        audio.pause();

        play.textContent = "▶";

      }

    });


    audio.addEventListener("timeupdate", () => {

      if (!audio.duration) return;

      const percentage =
        (audio.currentTime / audio.duration) * 100;

      progressFill.style.width =
        percentage + "%";

      progressKnob.style.left =
        percentage + "%";

      currentTime.textContent =
        formatTime(audio.currentTime);

    });


    audio.addEventListener("ended", () => {

      play.textContent = "▶";

      progressFill.style.width = "0%";

      progressKnob.style.left = "0%";

    });


    progress.addEventListener("click", (event) => {

      if (!audio.duration) return;

      const rect =
        progress.getBoundingClientRect();

      const percentage =
        (event.clientX - rect.left) / rect.width;

      audio.currentTime =
        percentage * audio.duration;

    });


    /* ================= QUESTIONS ================= */

    function showAnswer(text) {

      const input =
        document.getElementById("message");

      input.value = text;

      input.focus();

    }


    /* ================= CHAT ================= */

    const message =
      document.getElementById("message");

    const send =
      document.getElementById("send");


    send.addEventListener("click", () => {

      const text =
        message.value.trim();

      if (!text) return;

      alert(
        "Message envoyé : " + text
      );

      message.value = "";

    });


    message.addEventListener("keydown", (event) => {

      if (event.key === "Enter") {
        send.click();
      }

    });

  </script>

</body>
</html>
